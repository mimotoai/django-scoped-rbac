[project]
name = "django-scoped-rbac"
version = "0.8.0"
description = "A rich and flexible Django application for role-based access control within distinct access control scopes supporting Django Rest Framework."
readme = "README.rst"
authors = [{ name = "David Charboneau", email = "david@adadabase.com" }]
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "cel-expr-python>=0.1.3",
    "django>=5.2",
    "djangorestframework>=3.15",
    "scrudful>=0.2.0",
]

[project.urls]
Repository = "https://gitlab.com/openteams/django-scoped-rbac"

[dependency-groups]
dev = [
    "django-rest-framework-condition>=0.1.1",
    "drf-extensions>=0.8.0",
    "factory-boy>=3.3",
    "faker>=30",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-django>=4.9",
    "ruff>=0.15",
    # The scripted BDD tests rely on safetydance's step-signature rewriting, which
    # only exists on the python38 branch; safetydance-django 0.0.6 and
    # safetydance-test 0.1.4 are the last releases built against it.
    "astor",
    "safetydance",
    "safetydance-django==0.0.6",
    "safetydance-test==0.1.4",
    # safetydance imports pkg_resources at runtime; setuptools 81 removed it.
    "setuptools<81",
    "django-extensions>=4.1",
]
docs = [
    "sphinx>=8",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-rtd-theme>=3",
    "sphinxcontrib-django>=2.5",
]

[tool.uv]
default-groups = ["dev"]
# safetydance's PyScaffold 3.2 setup.py imports pkg_resources, removed in setuptools 81.
build-constraint-dependencies = ["setuptools<81"]

[tool.uv.sources]
astor = { git = "https://github.com/Quansight/astor.git", branch = "issue-174" }
safetydance = { git = "https://gitlab.com/openteams/safetydance.git", branch = "python38" }

[tool.uv.build-backend]
module-name = "scoped_rbac"
source-exclude = ["**/.*.sw?", "**/__pycache__"]

[build-system]
requires = ["uv_build>=0.9.0,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=scoped_rbac", "--cov-report=term-missing"]

[tool.coverage.run]
branch = true
source = ["scoped_rbac"]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if self\\.debug",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["src/scoped_rbac/migrations"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Line length is left to the formatter.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The safetydance BDD tests use star imports, step-injected names, and imports that
# register pytest fixtures or steps by side effect.
"tests/**" = ["E712", "E731", "F401", "F403", "F405", "F811", "F821", "F841"]
# ConditionalAnonymousAuthentication references undefined names and is unused; it
# needs a redesign rather than a lint fix.
"src/scoped_rbac/authentication.py" = ["F821"]
# The loops in policy_for and has_object_permission ignore their context variable;
# whether that is intended needs review before changing the authorization logic.
"src/scoped_rbac/permissions.py" = ["B007"]
