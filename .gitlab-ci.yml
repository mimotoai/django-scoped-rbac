# The non-slim images include git, which uv needs for the git-sourced dev dependencies.
image: ghcr.io/astral-sh/uv:python3.12-bookworm

variables:
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy

cache:
  key:
    files:
      - uv.lock
  paths:
    - .uv-cache

stages:
  - test
  - deploy

lint:
  stage: test
  script:
    - uv sync --locked
    - uv run ruff check
    - uv run ruff format --check
  after_script:
    - uv cache prune --ci

test:
  stage: test
  image: ghcr.io/astral-sh/uv:python${PYTHON_VERSION}-bookworm
  parallel:
    matrix:
      # 3.14 is excluded until safetydance stops using ast.NameConstant.
      - PYTHON_VERSION: ["3.11", "3.12", "3.13"]
  script:
    - uv sync --locked --python ${PYTHON_VERSION}
    - uv run --python ${PYTHON_VERSION} pytest
  coverage: '/^TOTAL.+?(\d+%)$/'
  after_script:
    - uv cache prune --ci

pages:
  stage: deploy
  script:
    - uv sync --locked --group docs
    - uv run make -C docs html
    - mkdir -p public
    - cp -r build/sphinx/html/* public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - docs/**/*
        - src/**/*

publish:
  stage: deploy
  # uv publish reads the PyPI token from the UV_PUBLISH_TOKEN CI/CD variable, which
  # should be protected and masked, as should PROJECT_ACCESS_TOKEN.
  before_script:
    - git config --global user.name "Gitlab CI/CD"
    - git config --global user.email "CICD@gitlab.com"
  script:
    - uv version --bump patch
    - uv build
    - uv publish
    - git add pyproject.toml uv.lock
    - git commit -m "[ci skip] updated to $(uv version --short)"
    - git push -o ci-skip "https://oauth2:${PROJECT_ACCESS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:${CI_DEFAULT_BRANCH}
  artifacts:
    paths:
      - dist
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - src/**/*
